# LDT4SSC pilot metadata
#
# This file describes your pilot at a glance and is read by the LDT4SSC
# aggregator to know what your pilot is and how to present it on the
# Knowledge Hub and the project website.
#
# This is the FIRST FILE you should edit after creating your pilot
# repository from the template. A pilot repository without a properly
# filled-in pilot.yaml will not be picked up by the aggregator.

schema_version: 1

# Short name of the pilot, in lowercase with hyphens (used in URLs)
short_name: municipal

# Human-readable name of the pilot
name: MUNICIPAL

# Short description of the pilot (one or two sentences)
description: >
  The MUNICIPAL pilot demonstrates a networked ecosystem of Local Digital Twins across energy, mobility, and public services by interconnecting the cities of Murcia and Nicosia. It leverages the SIMPL middleware to enable sovereign, cross-border sharing of data and AI-driven digital services.

# LDT4SSC work strand: WS1, WS2, or WS3
work_strand: WS1

# The cities, regions, or communities involved in this pilot
locations:
  - city: Murcia
    country: Spain
    country_code: ES
  - city: Nicosia
    country: Cyprus
    country_code: CY

# The thematic focus areas of the pilot, drawn from the LDT4SSC topic list.
# Pick all that apply. The full list is documented in the LDT4SSC Knowledge
# Hub under Resources for Pilots.
focus_areas:
  - Mobility
  - Air-quality
  - Public lighting

# The consortium members participating in this pilot
consortium:
  - name: Ubitech
    role: Pilot lead
    country_code: GR
    website: https://ubitech.eu/
  - name: Technical University of Denmark
    role: Research
    country_code: DK
    website: https://www.dtu.dk/
  - name: OdinS
    role: Technology partner
    country_code: ES
    website: https://odins.ai/
  - name: AI-nergy
    role: Technology partner
    country_code: DK
    website: https://ai-nergy.net/
  - name: University of Cyprus
    role: Research
    country_code: CY
    website: https://www.ucy.ac.cy/
  - name: Murcia Municipality
    role: Public authority
    country_code: ES
    website: https://web.murcia.es/
  - name: Nicosia Municipality
    role: Public authority
    country_code: CY
    website: https://www.nicosia.org.cy/

# Primary contact for the pilot
contact:
  name: Stamatis Diakakis
  email: sdiakakis@ubitech.eu
  organisation: Ubitech

# Date the pilot started (ISO 8601 format: YYYY-MM-DD)
start_date: 2026-05-14

# Optional: expected end date of the pilot
end_date: 2027-11-14

# Optional: list of external repositories or websites associated with this pilot
external_links:
   - label: UBITECH MUNICIPAL Press Release
     url: https://ubitech.eu/ubitech-awarded-ldt4ssc-cascading-grant-to-advance-cross-border-digital-twin-interconnection/
